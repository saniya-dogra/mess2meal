<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d"><title id="t">Mess2Meal donation lifecycle</title><desc id="d">Six stages: list surplus, check details, match recipients, confirm pickup, verify handover, measure impact.</desc>
<rect width="1200" height="470" rx="28" fill="#f0fdf4"/><text x="55" y="65" fill="#064e3b" font-family="Arial" font-size="34" font-weight="800">From surplus to shared meals</text><text x="57" y="101" fill="#4b6357" font-family="Arial" font-size="18">A human-verified workflow — recommendations are not food-safety certification.</text>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#059669" stroke-width="1.5"/></marker></defs>
<g font-family="Arial" text-anchor="middle">
<g transform="translate(45 175)"><rect width="155" height="150" rx="20" fill="#065f46"/><text x="77" y="52" font-size="34">🍲</text><text x="77" y="91" fill="#fff" font-size="19" font-weight="700">1. List food</text><text x="77" y="119" fill="#d1fae5" font-size="14">Source + quantity</text></g>
<path d="M205 250h28" stroke="#059669" stroke-width="4" marker-end="url(#arr)"/>
<g transform="translate(240 175)"><rect width="155" height="150" rx="20" fill="#047857"/><text x="77" y="52" font-size="34">🔎</text><text x="77" y="91" fill="#fff" font-size="19" font-weight="700">2. Review</text><text x="77" y="119" fill="#d1fae5" font-size="14">Expiry + handling</text></g>
<path d="M400 250h28" stroke="#059669" stroke-width="4" marker-end="url(#arr)"/>
<g transform="translate(435 175)"><rect width="155" height="150" rx="20" fill="#0f766e"/><text x="77" y="52" font-size="34">🤝</text><text x="77" y="91" fill="#fff" font-size="19" font-weight="700">3. Match</text><text x="77" y="119" fill="#ccfbf1" font-size="14">NGO + capacity</text></g>
<path d="M595 250h28" stroke="#059669" stroke-width="4" marker-end="url(#arr)"/>
<g transform="translate(630 175)"><rect width="155" height="150" rx="20" fill="#0d9488"/><text x="77" y="52" font-size="34">🚚</text><text x="77" y="91" fill="#fff" font-size="19" font-weight="700">4. Pickup</text><text x="77" y="119" fill="#ccfbf1" font-size="14">Agree a time</text></g>
<path d="M790 250h28" stroke="#059669" stroke-width="4" marker-end="url(#arr)"/>
<g transform="translate(825 175)"><rect width="155" height="150" rx="20" fill="#059669"/><text x="77" y="52" font-size="34">✅</text><text x="77" y="91" fill="#fff" font-size="19" font-weight="700">5. Verify</text><text x="77" y="119" fill="#d1fae5" font-size="14">Human handover</text></g>
<path d="M985 250h28" stroke="#059669" stroke-width="4" marker-end="url(#arr)"/>
<g transform="translate(1020 175)"><rect width="155" height="150" rx="20" fill="#064e3b"/><text x="77" y="52" font-size="34">📊</text><text x="77" y="91" fill="#fff" font-size="19" font-weight="700">6. Impact</text><text x="77" y="119" fill="#d1fae5" font-size="14">Delivered only</text></g>
</g><text x="600" y="405" text-anchor="middle" font-family="Arial" font-size="16" fill="#365b4a">Safety and recipient verification remain the responsibility of authorised people.</text></svg>