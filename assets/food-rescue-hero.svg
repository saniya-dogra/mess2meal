<text x="70" y="100" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="5">FOOD RESCUE • COMMUNITY IMPACT</text>
<text x="70" y="180" fill="#fff" font-family="Arial,sans-serif" font-size="64" font-weight="800">Good food.</text><text x="70" y="250" fill="#fff" font-family="Arial,sans-serif" font-size="64" font-weight="800">Better destinations.</text>
<text x="72" y="300" fill="#d1fae5" font-family="Arial,sans-serif" font-size="24">Connect surplus meals with people who need them.</text>
